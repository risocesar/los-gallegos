(function() {

  <!DOCTYPE html>
<html lang="es">
<head>

<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<!-- Supabase JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabaseUrl = 'https://gquzbidfnyfjanfpygcf.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxdXpiaWRmbnlmamFuZnB5Z2NmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2ODUzMjYsImV4cCI6MjEwNjI2MTMyNn0.U_Ihq8xWEYbc0qNIjgbP6qRJ4Plt-Vz0qkiM11tbVhw';
    window.supabaseInstance = supabase.createClient(supabaseUrl, supabaseKey);
  </script>
<style>
    body { font-family: 'Inter', sans-serif; }
  </style>

<body class="bg-[#f7f9fb] text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">
<div class="max-w-md w-full bg-white rounded-2xl border border-slate-200 shadow-xl overflow-hidden">
<!-- Header Marca -->
<div class="p-8 text-center border-b border-slate-100 bg-slate-50/60">
<div class="w-14 h-14 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-800 font-extrabold text-2xl flex items-center justify-center mx-auto mb-3 shadow-xs">
        LG
      </div>
<h1 class="text-xl font-bold text-slate-900 tracking-tight">Empresa Los Gallegos</h1>
<p class="text-xs text-slate-500 mt-1">CRM de Operaciones &amp; Servicios Técnicos</p>
</div>
<!-- Formulario Login -->
<form class="p-6 md:p-8 space-y-4 text-xs" onsubmit="ejecutarLogin(event)">
<div>
<label class="block font-bold text-slate-700 uppercase tracking-wider text-[11px] mb-1">Correo Electrónico *</label>
<input class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:border-blue-600 focus:bg-white transition" id="loginEmail" placeholder="nombre@losgallegos.com.ar" required="" type="email"/>
</div>
<div>
<div class="flex items-center justify-between mb-1">
<label class="font-bold text-slate-700 uppercase tracking-wider text-[11px]">Contraseña *</label>
<a class="text-[11px] text-blue-600 hover:underline" href="#" onclick="alert('Solicita el cambio de clave al Administrador de Operaciones.')">¿Olvidaste tu clave?</a>
</div>
<input class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:border-blue-600 focus:bg-white transition" id="loginPassword" placeholder="••••••••" required="" type="password"/>
</div>
<div class="hidden p-3 rounded-lg text-xs" id="alertaLogin"></div>
<button class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-lg text-xs shadow-sm transition" id="btnSubmitLogin" type="submit">
        Iniciar Sesión en el CRM
      </button>
<p class="text-center text-[11px] text-slate-400 pt-2">
        Acceso restringido para personal operativo y administrativo.
      </p>
</form>
</div>
<script>
    let db = null;
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof window.supabaseInstance !== 'undefined') {
        db = window.supabaseInstance;
      }
    });

    async function ejecutarLogin(e) {
      e.preventDefault();
      if (!db) return alert("Error de inicialización de Supabase");

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnSubmitLogin');
      const alerta = document.getElementById('alertaLogin');

      btn.disabled = true;
      btn.textContent = "Verificando credenciales...";
      alerta.classList.add('hidden');

      try {
        const { data: authData, error: authError } = await db.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (authError) throw authError;

        // Consultar el perfil y rol del usuario
        const { data: perfil, error: perfilError } = await db
          .from('perfiles_usuarios')
          .select('*')
          .eq('id', authData.user.id)
          .single();

        if (perfilError && perfilError.code !== 'PGRST116') {
          console.warn("No se pudo leer perfil:", perfilError);
        }

        const rol = perfil ? perfil.rol : 'tecnico_campo';
        const nombre = perfil ? perfil.nombre_completo : email;

        // Guardar sesión en Storage local
        const usuarioActivo = {
          id: authData.user.id,
          email: email,
          nombre_completo: nombre,
          rol: rol,
          especialidad: perfil ? perfil.especialidad_gremio : 'General'
        };

        localStorage.setItem('usuario_activo', JSON.stringify(usuarioActivo));
        localStorage.setItem('user_id', authData.user.id);
        localStorage.setItem('user_email', email);
        localStorage.setItem('user_name', nombre);
        localStorage.setItem('user_role', rol);

        // Redirección inteligente
        if (rol === 'tecnico_campo' || rol === 'tecnico') {
          window.location.href = 'direcciones.html';
        } else {
          window.location.href = 'direcciones.html';
        }

      } catch (err) {
        alerta.className = "p-3 rounded-lg text-xs bg-rose-50 text-rose-800 border border-rose-200 block";
        alerta.textContent = `Error: ${err.message || 'Credenciales incorrectas'}`;
      } finally {
        btn.disabled = false;
        btn.textContent = "Iniciar Sesión en el CRM";
      }
    }
  </script>
</body>

})();

</div>
